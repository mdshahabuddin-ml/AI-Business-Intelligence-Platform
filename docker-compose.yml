```yaml
version: "3.9"

services:

  backend:
    build: .
    container_name: ai_bi_backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./:/app

    depends_on:
      - postgres
      - chromadb

    restart: always

  postgres:
    image: postgres:16

    container_name: ai_bi_postgres

    restart: always

    environment:
      POSTGRES_DB: ai_business_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:latest

    container_name: ai_bi_chromadb

    ports:
      - "8001:8000"

    volumes:
      - chroma_data:/chroma/chroma

    restart: always

volumes:

  postgres_data:

  chroma_data: